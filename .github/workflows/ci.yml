name: CI
on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      # dart/swift tree-sitter grammar sources live in submodules; the build
      # generates the Swift parser from them.
      submodules: recursive
      # The compile matrix builds one job per platform, each with its own
      # toolchain, so every supported platform's build-tagged code is compiled.
      # darwin/amd64 is omitted because ONNX Runtime 1.27.0 ships no osx-x64
      # binary, so the offline profile cannot compile on Intel macOS. Keep this
      # list in sync with release.yml platforms.
      release_platforms: "darwin/arm64 linux/amd64 linux/arm64"
      cgo: true

  # update-live runs a release-tagged daemon and an untagged daemon against a
  # local release API server. It fails when the untagged daemon sends an update
  # request or the release-tagged daemon sends none.
  update-live:
    name: Update Live
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libpcre2-dev \
            pkg-config \
            zlib1g-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test update scheduler build gate
        run: make update-live

  # offline-live runs the offline-profile daemon in process against the fixture
  # and throwaway state, with the local vector store and the ONNX embedder.
  offline-live:
    name: Offline Live
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libpcre2-dev \
            pkg-config \
            zlib1g-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test offline runtime
        run: make offline-live
