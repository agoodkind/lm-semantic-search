name: CI
on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      # dart/swift tree-sitter grammar sources live in submodules; the build
      # generates the Swift parser from them.
      submodules: recursive
      # The compile matrix builds one job per platform, each with its own
      # toolchain, so every supported platform's build-tagged code is compiled.
      # darwin/amd64 is omitted because ONNX Runtime 1.27.0 ships no osx-x64
      # binary, so the offline profile cannot compile on Intel macOS. Keep this
      # list in sync with release.yml platforms.
      release_platforms: "darwin/arm64 linux/amd64 linux/arm64"
      cgo: true

  # update-live runs a release-tagged daemon and an untagged daemon against a
  # local release API server. It fails when the untagged daemon sends an update
  # request or the release-tagged daemon sends none.
  update-live:
    name: Update Live
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libpcre2-dev \
            pkg-config \
            zlib1g-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The update-live daemons read the offline embedding model from the
      # model cache root, which defaults to ~/.local/state/lm-semantic-search.
      # The suite fails when a run writes a file there. The cache root here is
      # the runner temp directory, with the Offline Live cache entry.
      - name: Restore offline embedding model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/offline-model-cache
          key: offline-model-${{ runner.os }}-${{ hashFiles('internal/offlinemodel/registry.go') }}
      - name: Test update scheduler build gate
        env:
          CLAUDE_CONTEXTD_MODEL_CACHE_ROOT: ${{ runner.temp }}/offline-model-cache
        run: make update-live

  # offline-live runs the offline-profile daemon in process against the fixture
  # and throwaway state, with the local vector store and the ONNX embedder.
  offline-live:
    name: Offline Live
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libpcre2-dev \
            pkg-config \
            zlib1g-dev
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The registry pins each offline model's revision and SHA-256 digests, so
      # a change to either selects a new cache entry. The daemon hashes every
      # cached artifact before use and downloads a replacement on a mismatch.
      - name: Restore offline embedding model cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/offline-model-cache
          key: offline-model-${{ runner.os }}-${{ hashFiles('internal/offlinemodel/registry.go') }}
      - name: Test offline runtime
        env:
          CLAUDE_CONTEXTD_MODEL_CACHE_ROOT: ${{ runner.temp }}/offline-model-cache
        run: make offline-live

  # install-live installs the latest release with the CLI install command and
  # runs update apply from a CLI stamped with an old version. It downloads the
  # newest GitHub release and verifies its attestations, and it fails when a
  # daemon candidate that cannot load libonnxruntime changes any installed
  # binary.
  install-live:
    name: Install Live
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test release install and update apply
        run: make install-live
