name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      cgo: true
      submodules: recursive
      binary: lm-semantic-search-daemon
      # darwin/amd64 is omitted because ONNX Runtime 1.27.0 ships no osx-x64
      # binary, so the offline profile cannot build on Intel macOS. Keep this
      # list in sync with ci.yml release_platforms.
      platforms: "darwin/arm64 linux/amd64 linux/arm64"

  auto-update-macos:
    name: Auto Update macOS 26
    needs: release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod
      - name: Test offline runtime
        run: make offline-live
      - name: Test automatic update
        run: go run ./cmd/ci-auto-update

  auto-update-debian:
    name: Auto Update Debian Trixie
    needs: release
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            gh \
            git \
            libpcre2-dev \
            pkg-config \
            tar \
            xz-utils
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          cache: false
          go-version-file: go.mod
      - name: Test offline runtime
        run: make offline-live
      - name: Test automatic update
        run: go run ./cmd/ci-auto-update
