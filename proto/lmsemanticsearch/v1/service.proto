syntax = "proto3";

package lmsemanticsearch.v1;

option go_package = "goodkind.io/lm-semantic-search/gen/go/lmsemanticsearch/v1;lmsemanticsearchv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service SemanticSearchDaemonService {
  rpc Version(VersionRequest) returns (VersionResponse);
  rpc StartIndex(StartIndexRequest) returns (StartIndexResponse);
  rpc ClearIndex(ClearIndexRequest) returns (ClearIndexResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc SyncIndex(SyncIndexRequest) returns (SyncIndexResponse);
  rpc UpdateCodebasePolicy(UpdateCodebasePolicyRequest) returns (UpdateCodebasePolicyResponse);
  rpc GetIndex(GetIndexRequest) returns (GetIndexResponse);
  rpc ListIndexes(ListIndexesRequest) returns (ListIndexesResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc WatchJobs(WatchJobsRequest) returns (stream WatchJobsResponse);
  rpc SearchCode(SearchCodeRequest) returns (SearchCodeResponse);
  rpc GraphTool(GraphToolRequest) returns (GraphToolResponse);
  rpc Doctor(DoctorRequest) returns (DoctorResponse);
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // SetMaintenanceMode turns maintenance mode on or off in the running daemon.
  // While it is on the daemon starts no background sweep, repair pass,
  // automatic rebuild, or collection load, refuses index and collection
  // writes, and fails searches fast with a maintenance status, so an operator
  // can back up or restore Milvus with no daemon traffic against it. The mode
  // is persisted in the daemon state root, so a daemon restart mid-maintenance
  // comes back still paused.
  rpc SetMaintenanceMode(SetMaintenanceModeRequest) returns (SetMaintenanceModeResponse);
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message VersionRequest {}

message VersionResponse {
  string version = 1;
  string commit = 2;
  string build_time = 3;
}

message ClientInfo {
  string name = 1;
  int32 pid = 2;
  // caller_cwd is the absolute working directory of the calling process.
  // The daemon resolves a relative request path against it; a relative
  // path with no caller_cwd is rejected, because the daemon's own working
  // directory is never the caller's.
  string caller_cwd = 3;
}

message SplitterConfig {
  string type = 1;
  int32 chunk_size = 2;
  int32 overlap = 3;
}

message IndexConfig {
  string splitter_type = 1;
  int32 splitter_chunk_size = 2;
  int32 splitter_overlap = 3;
  repeated string ignore_patterns = 4;
  string ignore_digest = 5;
  string embedding_provider = 6;
  string embedding_model = 7;
  int32 embedding_dimension = 8;
  string vector_backend = 9;
  bool hybrid = 10;
  repeated string include_submodules = 11;
}

enum SchedulingPriority {
  SCHEDULING_PRIORITY_UNSPECIFIED = 0;
  SCHEDULING_PRIORITY_HIGH = 1;
  SCHEDULING_PRIORITY_NORMAL = 2;
  SCHEDULING_PRIORITY_LOW = 3;
}

// SchedulingReason is the closed reason a queued or paused job cannot run.
enum SchedulingReason {
  SCHEDULING_REASON_UNSPECIFIED = 0;
  SCHEDULING_REASON_HIGHER_PRIORITY_WORK = 1;
  SCHEDULING_REASON_USER_ACTIVE = 2;
  SCHEDULING_REASON_ACTIVITY_UNAVAILABLE = 3;
  SCHEDULING_REASON_THERMAL_SAFETY = 4;
}

message SchedulingPolicy {
  SchedulingPriority priority = 1;
  bool quiet = 2;
  int32 idle_after_seconds = 3;
}

message SchedulingPolicyPatch {
  optional SchedulingPriority priority = 1;
  optional bool quiet = 2;
  optional int32 idle_after_seconds = 3;
}

message Progress {
  string phase = 1;
  double phase_percent = 2;
  double overall_percent = 3;
  int32 files_total = 4;
  int32 files_processed = 5;
  int32 chunks_generated = 6;
  int32 embedding_batches_total = 7;
  int32 embedding_batches_completed = 8;
  int32 collection_rows_written = 9;
  google.protobuf.Timestamp last_event_at = 10;
  google.protobuf.Timestamp heartbeat_at = 11;
  // chunks_reused counts chunks served from an already-embedded vector this run,
  // distinct from chunks_generated (embedded this run), so total = reused +
  // embedded is visible on the wire.
  int32 chunks_reused = 12;
  // unit is the human progress noun for the counted items: "file" for a code
  // index and "document" for a document collection. Empty reads as "file".
  string unit = 13;
  // breakdown is the resolved file-and-chunk outcome tree, the same structured
  // value every surface renders, so JSON consumers get the exact tree without
  // parsing the human text. Its file rows sum to processed.
  OutcomeBreakdown breakdown = 14;
  // chunks_processed counts chunks produced during this run.
  int32 chunks_processed = 15;
  // chunks_embedded counts chunks sent to the embedder during this run.
  int32 chunks_embedded = 16;
  // reuse_vectors_loaded counts old vectors loaded as reuse candidates during this run.
  int32 reuse_vectors_loaded = 17;
  // chunks_dropped counts refused inputs that could not be split safely.
  int32 chunks_dropped = 18;
}

// OutcomeKind is the semantic identity of one outcome row. The render layer maps
// a kind to its glyph and label, so the kind is the wire-safe representation.
enum OutcomeKind {
  OUTCOME_KIND_UNSPECIFIED = 0;
  OUTCOME_KIND_EMBEDDED = 1;
  OUTCOME_KIND_UNCHANGED = 2;
  OUTCOME_KIND_REMOVED = 3;
  OUTCOME_KIND_PENDING = 4;
  OUTCOME_KIND_OVERSIZE = 5;
  OUTCOME_KIND_UNREADABLE = 6;
  OUTCOME_KIND_ADDED = 7;
  OUTCOME_KIND_REUSED = 8;
}

// OutcomeRow is one child line in an outcome tree: a semantic kind and a count.
message OutcomeRow {
  OutcomeKind kind = 1;
  int32 count = 2;
}

// OutcomeBreakdown mirrors view.OutcomeBreakdown: the resolved tree shared by
// every surface. scope_label is the resolved "N of M ..." denominator text;
// file_rows always sum to processed.
message OutcomeBreakdown {
  string scope_label = 1;
  int32 processed = 2;
  int32 scope_total = 3;
  repeated OutcomeRow file_rows = 4;
  int32 chunks_total = 5;
  repeated OutcomeRow chunk_rows = 6;
}

message JobError {
  string message = 1;
  bool retryable = 2;
  string code = 3;
}

// DependencyHealth reports the daemon's view of shared-infrastructure health
// (the embedding pipeline and the vector store). It is one global fact, not a
// per-codebase value. It is observed from job and search outcomes, and readiness
// surfaces additionally run a debounced store probe before reading it.
// Timestamps are UTC on the wire.
message DependencyHealth {
  // degraded reports that some dependency condition is in effect and the human
  // surfaces show a banner. It does not report that work has stopped, so a
  // client that needs to know whether the pipeline is still moving reads mode
  // rather than this field. A store that cannot answer and an endpoint that is
  // unreachable, rejecting, or paused all stop indexing; a throttled endpoint
  // does not, and work continues between the batches it rejects.
  bool degraded = 1;
  // mode names the condition: "embedder_unreachable" and "embedder_rejected"
  // stop indexing until the endpoint or its configuration is fixed,
  // "embedder_paused" stops it until the endpoint resumes, "embedder_busy" is
  // throttling and indexing may continue between rejected batches,
  // "store_unavailable" stops search and indexing, and empty is healthy.
  string mode = 2;
  // since is when the current degraded mode began. Omitted while healthy.
  google.protobuf.Timestamp since = 3;
  // last_healthy_at is the last time the dependency named by mode answered, so
  // it describes the same dependency the mode does and matches what the human
  // banner shows. A dependency that has not answered in this daemon's lifetime
  // is omitted rather than filled in from the other dependency's evidence. A
  // healthy record names no single dependency, so it carries whichever of the
  // two answered most recently.
  google.protobuf.Timestamp last_healthy_at = 4;
}

message IndexRunSummary {
  int32 indexed_files = 1;
  int32 total_chunks = 2;
  string status = 3;
  google.protobuf.Timestamp completed_at = 4;
  repeated string skipped_files = 5;
  int64 total_bytes = 6;
}

message IndexRunFailure {
  string message = 1;
  int32 last_attempted_percentage = 2;
  google.protobuf.Timestamp failed_at = 3;
  string code = 4;
}

message Codebase {
  reserved 3;
  reserved "aliases";
  string id = 1;
  string canonical_path = 2;
  string status = 4;
  string active_job_id = 5;
  IndexRunSummary last_successful_run = 6;
  IndexRunFailure last_failed_run = 7;
  IndexConfig effective_config = 8;
  string collection_name = 9;
  repeated string legacy_collection_names = 10;
  string merkle_snapshot_path = 11;
  google.protobuf.Timestamp updated_at = 12;
  bool inode_tracking_disabled = 13;
  // display_status is the daemon-computed presentation status (preparing,
  // indexing, indexed, stale, failed) that every surface renders. It folds the
  // live job into the lifecycle status; status (field 4) stays the raw
  // lifecycle value for debugging.
  string display_status = 14;
  // glyph_token is the daemon-owned shape per display status (for example ⋯ for
  // waiting), so list rows render one vocabulary instead of each client owning a
  // map. status_label is the human word per display status.
  string glyph_token = 15;
  string status_label = 16;
  // reuse_sibling_count is the number of indexed sibling worktree collections a
  // discovered (not-yet-built) worktree will reuse on its deferred build. It is
  // zero for every other state and lets a list row show that a pending build is
  // cheap.
  int32 reuse_sibling_count = 17;
  // active_progress carries the live job's progress (including its breakdown)
  // for a codebase that is currently indexing, so the list and the TUI render
  // the same per-row tree the status surface shows. Nil when there is no active
  // job.
  Progress active_progress = 18;
  SchedulingPolicy scheduling_policy = 19;
  bool policy_pending_initialization = 20;
}

message Job {
  string id = 1;
  string codebase_id = 2;
  string requested_path = 3;
  string canonical_path = 4;
  ClientInfo client = 5;
  string operation = 6;
  string state = 7;
  Progress progress = 8;
  IndexConfig config = 9;
  google.protobuf.Timestamp started_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp completed_at = 12;
  JobError error = 13;
  // forced records that the caller passed force=true on the index request.
  bool forced = 14;
  // trigger names what started the run ("initial_build", "forced_reindex", or
  // "changed_files"), derived from the operation and the force flag.
  string trigger = 15;
  // display_state is the daemon-resolved presentation label for the job (for
  // example "failed (retryable)"), the authoritative status every surface
  // renders. state (field 7) stays the raw lifecycle value for machine parsing.
  string display_state = 16;
  // display_error is the resolved error line a surface shows beneath the job, or
  // empty when the job has no error or a degraded-dependency banner already
  // carries the cause. error (field 13) stays the raw error for machine parsing.
  string display_error = 17;
  // superseded reports a failed job overtaken by a later terminal job for the
  // same codebase. The daemon resolves it at the boundary, so machine consumers
  // read the same fact the human surfaces do. state (field 7) stays raw.
  bool superseded = 18;
  // superseded_by_job_id is the id of the immediate next terminal job for this
  // job's codebase when superseded, else empty.
  string superseded_by_job_id = 19;
  // outcome is the daemon-resolved terminal result: "succeeded", "failed", or
  // "canceled", and empty while the job is still live. Machine consumers read
  // this instead of deriving terminality from the raw state field.
  string outcome = 20;
  SchedulingPolicy effective_scheduling_policy = 21;
  uint64 queue_sequence = 22;
  // scheduling_reason is set only from the closed scheduling reason vocabulary.
  SchedulingReason scheduling_reason = 23;
}

message SearchResult {
  string relative_path = 1;
  int32 start_line = 2;
  int32 end_line = 3;
  string language = 4;
  double score = 5;
  string content = 6;
}

message StartIndexRequest {
  string path = 1;
  bool force = 2;
  SplitterConfig splitter = 3;
  repeated string ignore_patterns = 4;
  ClientInfo client = 5;
  repeated string include_submodules = 6;
  int32 max_job_chunks = 7;
  int64 max_job_bytes = 8;
  SchedulingPolicyPatch scheduling_policy = 9;
}

message StartIndexResponse {
  string job_id = 1;
  string codebase_id = 2;
  string state = 3;
  bool deduplicated = 4;
  string canonical_path = 5;
  string display_text = 6;
  // overlaps_codebase_id names the existing codebase whose canonical path
  // strictly prefix-covers this registration. Empty when there is no
  // overlap. Used by the daemon to surface the overlap hint to the caller.
  string overlaps_codebase_id = 7;
}

message ClearIndexRequest {
  string path = 1;
  ClientInfo client = 2;
}

message ClearIndexResponse {
  string codebase_id = 1;
  bool cleared = 2;
  string display_text = 3;
}

message CancelJobRequest {
  string job_id = 1;
  ClientInfo client = 2;
}

message CancelJobResponse {
  string job_id = 1;
  bool cancelled = 2;
  string display_text = 3;
}

message SyncIndexRequest {
  string path = 1;
  ClientInfo client = 2;
  SchedulingPolicyPatch scheduling_policy = 3;
}

message SyncIndexResponse {
  string job_id = 1;
  string codebase_id = 2;
  string state = 3;
  string display_text = 4;
}

message UpdateCodebasePolicyRequest {
  string path = 1;
  SchedulingPolicyPatch patch = 2;
  ClientInfo client = 3;
}

message UpdateCodebasePolicyResponse {
  Codebase codebase = 1;
  string display_text = 2;
}

message GetIndexRequest {
  string path = 1;
  ClientInfo client = 2;
}

message GetIndexResponse {
  Codebase codebase = 1;
  Job active_job = 2;
  bool tracked = 3;
  string display_text = 4;
  PathClassification classification = 5;
  DependencyHealth dependency_health = 6;
  // Searchable is true when the path is indexed and search_code may accept a
  // request. An idle collection is searchable because the request starts its
  // load. A loading collection is searchable because the request joins that
  // load. Classification.kind alone reflects only the on-disk index and stays
  // KIND_IN_SCOPE_INDEXED when the collection state is unknown.
  //
  // This field is proto3 optional so an explicit false survives JSON encoding.
  // A plain proto3 bool is omitted from JSON at its zero value, which made a
  // real false indistinguishable from a key the daemon never set. A consumer
  // must check field presence, not just truthiness, because the wire carries
  // three states:
  //
  //   Present and true: the path is indexed, and its collection is idle,
  //   loading, or ready. search_code may serve it after any required load.
  //
  //   Present and false: the path is not indexed, the collection is absent, the
  //   collection state is unknown, or the shared backend is unavailable.
  //
  //   Absent, no "searchable" key on the wire: the daemon has no answer. This
  //   is not a false. The probe did not complete, for example because the
  //   daemon errored before it reached the backend.
  //
  // A consumer that treats a missing key as false will allow a read it should
  // have gated. Check presence first, and only trust the value when the key
  // is present.
  optional bool searchable = 7;
  // CollectionReadiness is the per-path state of this codebase's own Milvus
  // collection, distinct from dependency_health (a global fact). One of "",
  // "absent", "idle", "building", "loading", "ready", or "unknown". Status
  // observations never load an idle collection. Search loads it on demand.
  string collection_readiness = 8;
  // maintenance reports whether the daemon is in maintenance mode. While it is
  // on, searchable is false because search_code fails fast rather than loading
  // the collection.
  MaintenanceStatus maintenance = 9;
}

// PathClassification reports how the daemon sees one queried path with
// respect to the codebases it tracks. Kind reports the overall outcome.
// Excluded_by_pattern and excluded_by_gitignore are populated when the path
// is in scope but masked by an ignore rule. Covering_codebase_id names the
// longest-prefix covering codebase, when any.
message PathClassification {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_IN_SCOPE_INDEXED = 1;
    KIND_IN_SCOPE_EXCLUDED = 2;
    KIND_IN_SCOPE_UNINDEXED = 3;
    KIND_OUT_OF_SCOPE = 4;
  }
  Kind kind = 1;
  string excluded_by_pattern = 2;
  string excluded_by_gitignore = 3;
  string covering_codebase_id = 4;
}

message ListIndexesRequest {}

message ListIndexesResponse {
  repeated Codebase indexes = 1;
  string display_text = 2;
  DependencyHealth dependency_health = 3;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
  string display_text = 2;
  DependencyHealth dependency_health = 3;
}

message ListJobsRequest {
  string codebase_id = 1;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  string display_text = 2;
  DependencyHealth dependency_health = 3;
}

message WatchJobsRequest {
  repeated string job_ids = 1;
}

message WatchJobsResponse {
  Job job = 1;
}

message SearchCodeRequest {
  string path = 1;
  string query = 2;
  int32 limit = 3;
  repeated string extension_filter = 4;
  ClientInfo client = 5;
}

message SearchCodeResponse {
  repeated SearchResult results = 1;
  Codebase codebase = 2;
  Job active_job = 3;
  string display_text = 4;
  DependencyHealth dependency_health = 5;
}

message GraphToolRequest {
  string path = 1;
  ClientInfo client = 2;
  string tool_name = 3;
  string args_json = 4;
}

message GraphToolResponse {
  string result_json = 1;
  string display_text = 2;
}

message Diagnostic {
  string severity = 1;
  string code = 2;
  string summary = 3;
  string detail = 4;
}

message DoctorRequest {}

message DoctorResponse {
  repeated Diagnostic diagnostics = 1;
  string display_text = 2;
}

message ShutdownRequest {}

message ShutdownResponse {
  bool accepted = 1;
}

// MaintenanceStatus is the daemon's maintenance mode. since is when the
// current mode began and reason is the operator's note, both empty while off.
// Timestamps are UTC on the wire.
message MaintenanceStatus {
  bool enabled = 1;
  string reason = 2;
  google.protobuf.Timestamp since = 3;
}

message SetMaintenanceModeRequest {
  bool enabled = 1;
  // reason is the operator's note, shown on every status surface while
  // maintenance is on. Ignored when enabled is false.
  string reason = 2;
  ClientInfo client = 3;
}

message SetMaintenanceModeResponse {
  MaintenanceStatus maintenance = 1;
  // active_jobs counts the jobs still running when the mode changed. Turning
  // maintenance on stops new work only; a job already embedding keeps going
  // until it ends or the operator cancels it.
  int32 active_jobs = 2;
  string display_text = 3;
}

// Metric is one named observation. name is a string value rather than a
// protobuf field name, so protojson casing never touches it and a counter reads
// identically on the terminal, in piped text, in JSON, and in the
// daemon.perf_counters log line. group orders the human surfaces and nothing
// else; a consumer selects by name, which is unique across every group. unit
// names what the value counts, taken from what the counter's increment call
// site actually counts, so a converge upsert reports paths and a skipped sync
// reports requests.
//
// The value is a oneof because a oneof member has explicit presence. protojson
// omits a plain proto3 scalar at its zero value, which would make false and
// absent indistinguishable; inside a oneof, 0, false, "" and an unset value
// stay four separate facts.
message Metric {
  string group = 1;
  string name = 2;
  string unit = 3;
  oneof value {
    int64 int_value = 4;
    double double_value = 5;
    bool bool_value = 6;
    string string_value = 7;
  }
}

// ActivityRow is one unit of work the daemon is doing or has queued, carried as
// metrics so every field uses the same naming as the counters. A row for work
// the file watcher started carries a job_id metric with no value, because that
// work registers no job and the job commands cannot address it.
message ActivityRow {
  repeated Metric metrics = 1;
}

// DaemonIdentity names the running process. started_at is the daemon's own
// start time, so a caller derives uptime from the process rather than from its
// own clock.
message DaemonIdentity {
  string version = 1;
  string commit = 2;
  int32 pid = 3;
  string socket_path = 4;
  google.protobuf.Timestamp started_at = 5;
}

message GetStatusRequest {}

// ActivitySourceStatus reports the cached host-activity decision used by quiet
// scheduling. Reasons use SchedulingReason so callers never parse host text.
message ActivitySourceStatus {
  bool input_available = 1;
  bool thermal_available = 2;
  bool thermal_unsafe = 3;
  SchedulingReason input_reason = 4;
  SchedulingReason thermal_reason = 5;
}

// GetStatusResponse reports what the daemon is doing and what its counters
// read. It carries only non-terminal work, so it stays a few kilobytes rather
// than growing with job history the way ListJobs does.
message GetStatusResponse {
  google.protobuf.Timestamp read_at = 1;
  DaemonIdentity daemon = 2;
  repeated Metric metrics = 3;
  repeated ActivityRow activity = 4;
  string display_text = 5;
  ActivitySourceStatus activity_source = 6;
  MaintenanceStatus maintenance = 7;
}
